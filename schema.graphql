    contactMechanisms(pageInfo: PageInfoInput!): PartyContactMechanismConnection!
    relationships(pageInfo: PageInfoInput!): PartyRelationshipConnection!
    roles(pageInfo: PageInfoInput!): PartyRoleConnection!
    classifications(pageInfo: PageInfoInput!): PartyClassificationConnection!
}

# Person extends Party for organization-specific fields
extend type Person @key(fields: "id") {
    id: ID! @external
    # Person-specific fields would be added here when implementing Person service
}

# Organization extends Party for organization-specific fields
extend type Organization @key(fields: "id") {
    id: ID! @external
    # Organization-specific fields would be added here when implementing Organization service
}

